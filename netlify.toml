# Configuración de Netlify. El plugin oficial de Next.js lo añade Netlify solo
# al detectar next.config.js; no hace falta declararlo aquí.

[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# El service worker debe poder controlar todo el origen y no cachearse.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions]
  directory = "netlify/functions"
